<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Air Cairo Forms">
<title>Air Cairo Forms</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#17191c;--muted:#6b7280;--line:#e5e7eb;--accent:#111;--soft:#eef0f3;--danger:#b42318;--ok:#067647;}
*{box-sizing:border-box} html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent} body{padding-bottom:92px}
button,input,textarea,select{font:inherit} button{cursor:pointer} .hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:11px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}.brand strong{display:block;font-size:15px}.brand span{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.container{max-width:760px;margin:0 auto;padding:16px}.screen-title{margin:4px 0 14px;font-size:24px}.subtitle{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.03)}
.form-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px}.form-card h3{margin:0 0 5px;font-size:17px}.form-card p{margin:0;color:var(--muted);font-size:12px}.arrow{font-size:25px;color:var(--muted)}
.primary,.secondary,.danger{border:0;border-radius:13px;padding:13px 15px;font-weight:700}.primary{background:#111;color:#fff}.secondary{background:var(--soft);color:#111}.danger{background:#fff0ef;color:var(--danger);border:1px solid #ffd2cf}.full{width:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin:0 0 6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d8dce1;border-radius:12px;background:#fff;padding:12px;outline:none}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#111;box-shadow:0 0 0 3px rgba(0,0,0,.06)}
.section{border:1px solid var(--line);border-radius:16px;background:#fff;margin-bottom:11px;overflow:hidden}.section summary{list-style:none;padding:15px;display:flex;justify-content:space-between;align-items:center;font-weight:800}.section summary::-webkit-details-marker{display:none}.section-body{padding:0 12px 12px}.section small{color:var(--muted)}
.item{padding:12px 2px;border-top:1px solid #edf0f2}.item:first-child{border-top:0}.item-name{font-size:13px;line-height:1.35;font-weight:650;margin-bottom:9px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.choice{min-height:42px;border:1px solid #d9dde2;border-radius:10px;background:#fff;font-weight:800;font-size:12px}.choice.active{background:#111;color:#fff;border-color:#111}.choice[data-v="U"].active{background:#b42318;border-color:#b42318}.choice[data-v="D"].active{background:#7a5af8;border-color:#7a5af8}.choice[data-v="N/A"].active{background:#667085;border-color:#667085}
.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rating .choice{min-height:44px}.general{display:grid;grid-template-columns:1fr 1fr;gap:10px}.general .choice{width:100%}
.checktypes{display:grid;gap:8px}.type{border:1px solid #d9dde2;background:#fff;border-radius:13px;padding:13px;text-align:left;font-weight:750}.type.active{border-color:#111;background:#111;color:#fff}
.legend{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}.pill{border-radius:999px;padding:6px 9px;background:var(--soft);font-size:11px;font-weight:800}.progress{display:flex;gap:5px;margin:3px 0 16px}.dot{height:5px;flex:1;background:#ddd;border-radius:9px}.dot.active{background:#111}.step-label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:9px}.bottom button{flex:1}.toolbar{display:flex;gap:8px;margin:8px 0 14px}.toolbar button{flex:1}
.sig{border:1px dashed #b9bec6;border-radius:14px;background:#fafafa;overflow:hidden}.sig canvas{display:block;width:100%;height:145px;touch-action:none}.sigbar{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e5e7eb;padding:7px 9px}.sigbar span{font-size:11px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:700;z-index:50;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
.builder-row{display:flex;gap:7px;align-items:center;margin-bottom:8px}.builder-row input{flex:1}.builder-row button{flex:0 0 auto}.mini{padding:9px 10px!important;font-size:12px}
.print-only{display:none}
@media print{body{background:#fff;padding:0}.top,.bottom,.toolbar,.no-print{display:none!important}.container{max-width:none;padding:0}.print-only{display:block}.card,.section{box-shadow:none;break-inside:avoid}.section{margin-bottom:8px}.item{padding:7px 2px}.choice{min-height:26px;padding:3px}.sig canvas{height:100px}.screen-title{font-size:20px}}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.choices{max-width:420px}.container{padding:24px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><div class="logo">AC</div><div><strong>Air Cairo</strong><span>Flight Operation · Flight Training Department</span></div></div></header>
<main class="container" id="app"></main>
<div class="toast" id="toast"></div>
<script>
const KEY='airCairoFormsV2';
const defaultForm={id:'line-check',title:'Line Check Form',code:'FLTOPS/TRNG 01',description:'Mobile version of the Line Check Form',type:'linecheck',sections:[
{name:'1. PRE FLIGHT',items:['Dispatch','ATIS, SNOWTAM And Braking Action*','Computerized And ATC Flight Plan','Weather Briefing, T/O And Landing Min.','Alternate Planning Wx Min','Operations Specifications','NOTAM Briefing And “B” Snags','Cabin Crew Safety Briefing']},
{name:'2. COCKPIT',items:['Technical Log And B Snags','MEL-CDL And The Effect On T/O - Landing','Performance','Aircraft Library And Documentation','Cockpit Preparation - FMC / FMGS','T/O Briefing','Load, Trim Sheet And NOTOC','SNOWTAM (De-icing)*','Hot Wx Operation / Cold Wx Operation','T/O Performance, T/O Speeds And C.G','Engine Start Procedures']},
{name:'3. TAXI, TAKE-OFF AND INITIAL CLIMB',items:['Push Back Procedures','Aircraft Geometry During Turns','Taxi Speed And Braking Technique','T/O Roll And V1 Concept','Noise Abatement Procedure And Initial Climb','Best Angle, Best Rate And Turbulence Speeds','Area Departure, SID And Holding']},
{name:'4. CRUISE',items:['Flight Level Selection, Specific Range & OPT ALT','Step Climb And Fuel Saving','Cruise Mach No And Maneuver Capability','Use Of Weather Radar & Weather Avoidance','Drift Down Procedure','Enroute Alternate And Emergency Procedures','Alternate Weather Minima','Inflight Fuel Monitoring & RVSM Check','Communication Failure Procedures','Communication Procedures VHF/ HF (Stockholm Radio) / DATALINK','Volcanic Ash','MNPS / NAT / Special Route']},
{name:'5. DESCENT AND APPROACH',items:['Descent Planning, Approach Briefing, And STARS','PBN Procedures (RNP APCH)','Approaches: Precision / Non-Precision / Visual','Destination And Alternate Weather Minima']},
{name:'6. LANDING AND TAXI IN',items:['Landing Technique','Use of Auto Brakes And Reverse Thrust','After Landing And Taxi In Procedures']},
{name:'7. KNOWLEDGE CHECK — A) OPERATIONS MANUAL (OM-PART A)',items:['IOE, Initial Release, USV & Command Responsibilities','Navigation Bag Contents','The Difference Between Planning And Actual Weather Min. And Weather Min. For New Captain.','Fuel Policy & Fuel Conservation Management (FCM)','Windshear, Thunderstorms And Turbulence','Fuelling With PAX On Board','Dangerous Goods','Shoulder Harness, Seat Belt Policy','Aircraft Geometry During Turns','Cockpit Door','F/O T/O And Landing','ECARS 121']},
{name:'8. KNOWLEDGE CHECK — B) AIRCRAFT PERFORMANCE AND TECHNICAL KNOWLEDGE',items:['Operational System Knowledge','T/O Performance Limits','Wet And Contaminated Runways','Reduced (Flex) / (ATM) thrust','Approach And Landing Climb Performance','Normal, Non-normal & Emergency Procedures','Flight Patterns','Electronic Flight Bag (EFB)']},
{name:'9. KNOWLEDGE CHECK — C) SAFETY PROCEDURES',items:['Communication Between Cockpit And Cabin','Emergency Evacuation Procedures','Prepared/Unprepared Emergency','Bomb On Board And Least Risk Location','Crew Incapacitation','Hijacking','Safety Management System (SMS)']}
],evaluation:{knowledge:['Operations Manual (OM-Part A) And Relevant ECARS','A/C Systems, Limitations And Performance','Normal, Non-Normal Procedures*','Air Cairo Operations Specifications'],flying:['Compliance With SOP (OM-Part A & FCOM)','Attitude Flying And Correct Trim Technique','Aeroplane Configuration, Altitude. & Speed Control','Flying Accuracy & Smoothness'],management:['Compliance With Operations Manual (OM-Part A)','Planning Ahead And Use Of FMC Or FMGS','Crew Coordination And Use Of Available Resources','Adherence To Clearances And Safe Heights','Cabin Crew Safety Briefing']}};
let forms=JSON.parse(localStorage.getItem(KEY)||'null')||[defaultForm];
let state={screen:'home',form:null,step:1,data:{},builder:null};
function saveAll(){localStorage.setItem(KEY,JSON.stringify(forms))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function home(){state={screen:'home',form:null,step:1,data:{},builder:null};render()}
function openForm(id){state.form=forms.find(f=>f.id===id);state.step=1;state.data=loadDraft(id)||{};state.screen='form';render()}
function loadDraft(id){try{return JSON.parse(localStorage.getItem('draft_'+id)||'null')}catch{return null}}
function saveDraft(){if(!state.form)return;localStorage.setItem('draft_'+state.form.id,JSON.stringify(state.data));toast('Draft saved')}
function clearDraft(){if(!state.form)return;localStorage.removeItem('draft_'+state.form.id);state.data={};render();toast('Draft cleared')}
function set(k,v){state.data[k]=v;}
function val(k){return state.data[k]||''}
function render(){const a=document.getElementById('app');if(state.screen==='home')return renderHome(a);if(state.screen==='builder')return renderBuilder(a);renderForm(a)}
function renderHome(a){a.innerHTML=`<h1 class="screen-title">Forms</h1><div class="subtitle">Mobile-first forms. Open a form, complete it step by step, sign it, then print or save as PDF.</div>${forms.map(f=>`<div class="card form-card" onclick="openForm('${esc(f.id)}')"><div><h3>${esc(f.title)}</h3><p>${esc(f.code||'Custom form')} · ${esc(f.description||'')}</p></div><div class="arrow">›</div></div>`).join('')}<div class="card no-print"><button class="secondary full" onclick="showBuilder()">＋ Add New Form</button></div><div class="card no-print"><small><b>Current form:</b> Line Check Form was rebuilt from the supplied Line check.pdf with a mobile workflow instead of the paper table layout.</small></div>`}
function showBuilder(){state.screen='builder';state.builder={title:'',code:'',description:'',sections:[{name:'Section 1',items:['Item 1']}],evaluation:{knowledge:[],flying:[],management:[]}};render()}
function renderBuilder(a){const b=state.builder;a.innerHTML=`<div class="toolbar no-print"><button class="secondary" onclick="home()">← Forms</button><button class="primary" onclick="createForm()">Save Form</button></div><h1 class="screen-title">Form Builder</h1><div class="subtitle">Create another form without changing the app core. Add sections and checklist items, then the form appears on the main screen.</div><div class="card"><div class="field"><label>FORM TITLE</label><input id="btitle" value="${esc(b.title)}" placeholder="e.g. Simulator Check Form"></div><div class="grid"><div class="field"><label>FORM CODE</label><input id="bcode" value="${esc(b.code)}" placeholder="e.g. FLTOPS/TRNG 02"></div><div class="field"><label>DESCRIPTION</label><input id="bdesc" value="${esc(b.description)}"></div></div></div>${b.sections.map((s,i)=>`<div class="card"><div class="field"><label>SECTION ${i+1}</label><input value="${esc(s.name)}" oninput="builderSectionName(${i},this.value)"></div><div id="items${i}">${s.items.map((it,j)=>`<div class="builder-row"><input value="${esc(it)}" oninput="builderItem(${i},${j},this.value)"><button class="danger mini" onclick="removeItem(${i},${j})">×</button></div>`).join('')}</div><button class="secondary mini" onclick="addItem(${i})">＋ Add item</button> <button class="danger mini" onclick="removeSection(${i})">Remove section</button></div>`).join('')}<button class="secondary full no-print" onclick="addSection()">＋ Add Section</button>`}
function syncBuilder(){state.builder.title=document.getElementById('btitle')?.value||state.builder.title;state.builder.code=document.getElementById('bcode')?.value||state.builder.code;state.builder.description=document.getElementById('bdesc')?.value||state.builder.description}
function builderSectionName(i,v){state.builder.sections[i].name=v}
function builderItem(i,j,v){state.builder.sections[i].items[j]=v}
function addItem(i){state.builder.sections[i].items.push('New item');render()}
function removeItem(i,j){state.builder.sections[i].items.splice(j,1);render()}
function addSection(){state.builder.sections.push({name:'New Section',items:['New item']});render()}
function removeSection(i){state.builder.sections.splice(i,1);render()}
function createForm(){syncBuilder();if(!state.builder.title.trim())return toast('Enter a form title');const f={...state.builder,id:'custom-'+Date.now(),type:'custom'};forms.push(f);saveAll();toast('Form added');setTimeout(home,400)}
function renderForm(a){const f=state.form;const steps=['Check Details','Line Check Items','Performance Evaluation','Comments & Signatures'];const p=((state.step-1)/3)*100;a.innerHTML=`<div class="toolbar no-print"><button class="secondary" onclick="home()">← Forms</button><button class="secondary" onclick="saveDraft()">Save Draft</button><button class="secondary" onclick="clearDraft()">Clear</button></div><div class="step-label">Step ${state.step} of 4 · ${steps[state.step-1]}</div><div class="progress">${[1,2,3,4].map(i=>`<div class="dot ${i<=state.step?'active':''}"></div>`).join('')}</div><h1 class="screen-title">${esc(f.title)}</h1><div class="subtitle">Air Cairo · Flight Operation · Flight Training Department · ${esc(f.code||'')}</div>${state.step===1?step1():state.step===2?step2():state.step===3?step3():step4()}${state.step<4?`<div class="bottom no-print"><button class="secondary" onclick="prev()" ${state.step===1?'disabled':''}>Back</button><button class="primary" onclick="next()">Next</button></div>`:`<div class="bottom no-print"><button class="secondary" onclick="prev()">Back</button><button class="primary" onclick="printForm()">Print / Save PDF</button></div>`}`}
function field(k,label,type='text',ph=''){return `<div class="field"><label>${label}</label><input type="${type}" data-key="${k}" value="${esc(val(k))}" placeholder="${esc(ph)}" oninput="set('${k}',this.value)"></div>`}
function step1(){return `<div class="card"><h3>Check Details</h3><div class="grid">${field('name','Name')}${field('codeNo','Code No.')}${field('acType','A/C Type')}${field('date','Date','date')}${field('route','Area / Route')}${field('sectors','No. Of Sectors','number')}${field('flightTime','Flight Time')}${field('crewPosition','Crew Position')}</div></div><div class="card"><h3>Check Type</h3><div class="checktypes">${['Final Line Check','Annual Line Check **','Area / Route Check','Random / Remedial'].map(x=>`<button class="type ${val('checkType')===x?'active':''}" onclick="set('checkType','${esc(x)}');render()">${esc(x)}</button>`).join('')}</div></div>`}
function itemHTML(sectionIndex,item){const key='i_'+sectionIndex+'_'+btoa(unescape(encodeURIComponent(item))).replace(/[^a-zA-Z0-9]/g,'').slice(0,24);const v=val(key);return `<div class="item"><div class="item-name">${esc(item)}</div><div class="choices">${['S','U','D','N/A'].map(x=>`<button class="choice ${v===x?'active':''}" data-v="${x}" onclick="set('${key}','${esc(x)}');render()">${x}</button>`).join('')}</div></div>`}
function step2(){return `<div class="legend"><span class="pill">S = Satisfactory</span><span class="pill">U = Unsatisfactory</span><span class="pill">D = Discussed</span><span class="pill">N/A = Not Applicable</span></div>${state.form.sections.map((s,i)=>`<details class="section" ${i<2?'open':''}><summary>${esc(s.name)} <span>⌄</span></summary><div class="section-body">${s.items.map(it=>itemHTML(i,it)).join('')}</div></details>`).join('')}`}
function ratingHTML(group,index,item){const key='r_'+group+'_'+index;const v=val(key);return `<div class="item"><div class="item-name">${esc(item)}</div><div class="rating">${['S1','S2','S3','S4','S5'].map(x=>`<button class="choice ${v===x?'active':''}" onclick="set('${key}','${x}');render()">${x}</button>`).join('')}</div></div>`}
function step3(){const e=state.form.evaluation||defaultForm.evaluation;return `<div class="legend"><span class="pill">S1 = Unsatisfactory</span><span class="pill">S2 = Below average</span><span class="pill">S3 = Average</span><span class="pill">S4 = Good</span><span class="pill">S5 = Very Good</span></div>${[['knowledge','Knowledge'],['flying','Flying Skills'],['management','Management']].map(([g,title])=>`<details class="section" open><summary>${title}<span>⌄</span></summary><div class="section-body">${(e[g]||[]).map((it,i)=>ratingHTML(g,i,it)).join('')}</div></details>`).join('')}<div class="card"><h3>General</h3>${['Situational Awareness','Discipline'].map((it,i)=>{let k='gen_'+i;let v=val(k);return `<div class="item"><div class="item-name">${it}</div><div class="general">${['US','S'].map(x=>`<button class="choice ${v===x?'active':''}" onclick="set('${k}','${x}');render()">${x}</button>`).join('')}</div></div>`}).join('')}</div>`}
const sigNames=[['instructorSig','Instructor Signature'],['traineeSig','Trainee Signature'],['inspectorSig','ECAA Inspector Signature **'],['chiefSig','Chief Pilot Signature'],['managerSig','Training Manager']];
function step4(){return `<div class="card"><div class="field"><label>COMMENTS</label><textarea oninput="set('comments',this.value)" placeholder="Enter comments...">${esc(val('comments'))}</textarea></div><div class="field"><label>CHECK RESULT — CURRENT</label><div class="general">${['S','US'].map(x=>`<button class="choice ${val('currentResult')===x?'active':''}" onclick="set('currentResult','${x}');render()">${x}</button>`).join('')}</div></div><div class="grid">${field('previousResult','Previous Result')}${field('caEpName','CA / EP Name')}${field('caEpCode','CA / EP Code No.')}</div></div>${sigNames.map(([k,n])=>`<div class="card"><h3>${n}</h3><div class="sig"><canvas id="${k}" width="700" height="300"></canvas><div class="sigbar"><span>Sign with finger / mouse</span><button class="secondary mini" onclick="clearSig('${k}')">Clear</button></div></div></div>`).join('')}<div class="card no-print"><button class="primary full" onclick="saveDraft()">Save Draft</button></div><div class="card print-only"><b>Note:</b> Non-Normal Procedures are Abnormal, Additional, Alternate and Emergency Procedures. ** If Required.</div>`}
function initSigs(){sigNames.forEach(([k])=>{const c=document.getElementById(k);if(!c)return;const ctx=c.getContext('2d');ctx.lineWidth=3;ctx.lineCap='round';let drawing=false;let last=null;const pos=e=>{const r=c.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}};const start=e=>{e.preventDefault();drawing=true;last=pos(e)};const move=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;state.data[k]=c.toDataURL('image/png')};const end=()=>drawing=false;c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);if(val(k)){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.width,c.height);im.src=val(k)}})}
function clearSig(k){set(k,'');render()}
function next(){if(state.step<4){saveDraft();state.step++;render();setTimeout(initSigs,50)}else printForm()}
function prev(){if(state.step>1){saveDraft();state.step--;render()}}
function printForm(){saveDraft();window.print()}
render();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body></html>
